<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier</title>
  <meta name="description" content="NovelAI 작가 태그 · 그림체 아카이브">
  <meta name="theme-color" content="#FAFAF7">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Atelier">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">Atelier</span>
      <span class="brand-sub">NovelAI Archive</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="갤러리">
      <button class="tab" type="button" role="tab" data-tab="artists">작가<span class="count" id="countArtists"></span></button>
      <button class="tab" type="button" role="tab" data-tab="styles">그림체<span class="count" id="countStyles"></span></button>
    </nav>
    <label class="search">
      <span id="searchIcon" aria-hidden="true"></span>
      <input id="search" type="search" placeholder="검색" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </label>
    <div class="actions">
      <button class="btn btn-primary add-btn" id="addBtn" type="button"><span class="i" id="addIcon"></span><span id="addLabel">추가</span></button>
      <button class="icon-btn" id="settingsBtn" type="button" title="백업 · 동기화" aria-label="백업 · 동기화"></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="filters" id="filters"></div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <div id="layers"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="dropzone" id="dropzone" hidden>
    <div class="dropzone-box"><div class="t"></div><div class="s"></div></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
